<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENE · 愿望与交付</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="wants"><a class="skip" href="#workspace">跳到愿望</a>
<header class="app-bar"><a class="wordmark" href="index.html"><span class="brand-icon">e</span> ENE</a><nav id="page-nav" aria-label="项目页面"></nav><div class="bar-end"><select id="project-choice" aria-label="选择项目示例"></select><details class="work-popover"><summary id="work-label">工作 · 未知</summary><div id="work-details"></div></details></div></header>
<main id="workspace" class="flow-shell"><div class="page-heading"><div><p class="eyebrow">INPUT → OUTPUT · ENE BASE 1.0</p><h1 id="project-title">我的愿望，交付了什么。</h1></div><span id="connection" class="connection" role="status"></span></div><div id="example-note" class="notice" hidden></div>
<section class="input-lane" aria-label="愿望选择"><div class="lane-heading"><h2>我的愿望</h2><span id="want-count" class="quiet"></span></div><div class="filter-tools"><input id="want-search" type="search" aria-label="搜索愿望" placeholder="搜索愿望、说明、编号"><input id="change-filter" type="search" list="change-suggestions" aria-label="筛选关联任务" placeholder="按任务名称或编号筛选"><datalist id="change-suggestions"></datalist><select id="want-sort" aria-label="愿望排序"><option value="new">最新记录</option><option value="old">最早记录</option><option value="updated">最近更新</option></select><div class="reading-control" role="group" aria-label="阅读字号"><span>字号</span><button id="reading-less" aria-label="缩小字号">−</button><output id="reading-value" aria-live="polite"></output><button id="reading-more" aria-label="增大字号">＋</button><button id="reading-reset" class="text-button">恢复默认</button></div><button id="clear-filters" class="text-button">清除筛选</button></div><div id="state-tabs" class="state-tabs" aria-label="愿望状态筛选"></div><div id="want-scroll" class="want-viewport" role="region" aria-label="愿望卡片滚动区" tabindex="0"><div id="want-list" class="want-axis" aria-label="愿望列表"></div></div><div class="axis-footer"><span id="filter-count" class="quiet"></span><span class="quiet">卡片区内可滚动 · 点卡片看下面的交付</span></div><p id="sort-note" class="quiet sort-note"></p></section>
<section id="intent" class="intent-bridge" aria-live="polite"></section>
<section class="output-lane" aria-label="愿望的回应"><div class="lane-heading"><h2>这个愿望的回应</h2><span id="response-count" class="quiet"></span></div><div id="result-axis" class="result-axis"></div><div id="delivery" aria-live="polite"></div></section>
<section id="recent-work" class="recent-work" aria-labelledby="recent-work-title"><div class="lane-heading"><h2 id="recent-work-title">最近后台工作 · 状态保留</h2><span class="quiet">施工记录，和作品版本分别管理</span></div><div id="recent-work-details" class="panel"></div></section><footer><span>愿望由 Discussion 维护 · 施工完成与 Owner 接受分别记录</span><a href="materials.html">项目约定与冻结 ↗</a></footer></main>
<script src="project-state.js"></script><script src="config-data.js"></script><script src="model.js"></script><script src="shell.js"></script><script src="app.js"></script></body></html>
